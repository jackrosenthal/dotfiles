# =============================================================================
# Core
# =============================================================================

# Inside tmux $TERM is tmux-256color; the override tells tmux the OUTER
# terminal can render true color so it stops downsampling.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -as terminal-overrides ",*:Smulx=\\E[4::%p1%dm"
set -as terminal-overrides ",*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

# Declare clipboard (OSC 52) capability so tmux will forward selections
# through to the OUTER terminal's clipboard. Critical for ssh: when tmux
# is running on a remote host, the OSC 52 sequence travels back through
# the ssh stream and alacritty (osc52 = "CopyPaste") writes the bytes
# into the local Wayland clipboard.
set -as terminal-features ",alacritty:clipboard"
set -as terminal-features ",xterm*:clipboard"

# Preserve OSC 8 hyperlink escape sequences when tmux redraws. Without this,
# clickable links emitted by gh / claude / modern shells get stripped and the
# outer terminal never sees them. With it, alacritty's hint system (which
# already has hyperlinks = true) makes Ctrl+Click open them. For bare URLs
# in plain text, hold Shift too — Ctrl+Shift+Click — so tmux releases the
# mouse event back to alacritty for hint matching.
set -as terminal-features ",alacritty:hyperlinks"
set -as terminal-features ",xterm*:hyperlinks"

# Required for Claude Code (and other TUIs) to know when the terminal regains
# focus so they can repaint / pause animations correctly.
set -g focus-events on

# tmux otherwise waits 500ms after ESC to disambiguate from alt-key sequences,
# which makes modal UIs (Claude Code, vim) feel sluggish.
set -s escape-time 0

# Let inner programs use OSC 52 clipboard, sixel/kitty graphics, hyperlinks,
# and other escape sequences tmux would otherwise swallow. set-clipboard is
# "external" (not "on") so tmux forwards OSC 52 from inner apps unchanged
# instead of rewriting the selector; our copy bindings below emit "pc" so the
# selection lands in both the system CLIPBOARD and PRIMARY at once.
set -g allow-passthrough on
set -g set-clipboard external

set -g history-limit 100000

# 1-indexed windows + panes; renumber on close so the list stays tidy.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# When the last window in a session closes, switch to another session instead
# of dumping you back to the shell.
set -g detach-on-destroy off

set -g set-titles on
set -g set-titles-string "#S · #W"

setw -g monitor-activity on
set -g visual-activity off

setw -g mode-keys vi
set -g status-keys emacs

# =============================================================================
# Mouse
# =============================================================================

set -g mouse on

# Hover-to-focus panes. Added to tmux master in 2025-12 (post-3.6a); silently
# inert on older tmux until the host upgrades.
set -g focus-follows-mouse on

# Wheel scroll: in the alternate screen (less, vim, fzf, Claude Code) forward
# the wheel events so the program scrolls natively. Otherwise enter copy mode
# and scroll the scrollback. -e auto-exits copy mode when you reach the bottom.
bind -T root WheelUpPane   if-shell -Ft= "#{?pane_in_mode,1,#{alternate_on}}" "send-keys -M" "copy-mode -e ; send-keys -M"
bind -T root WheelDownPane if-shell -Ft= "#{?pane_in_mode,1,#{alternate_on}}" "send-keys -M" "send-keys -M"

# Drag-select copies to the system clipboard but keeps you in copy mode so you
# can keep reading. Selection arrives in the local clipboard via the clip-copy
# helper, which emits OSC 52 with the "pc" selector so the bytes land in both
# CLIPBOARD (Ctrl+Shift+V) and PRIMARY (middle-click). Works the same whether
# tmux runs locally or on a remote ssha host.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "clip-copy"
bind -T copy-mode-vi DoubleClick1Pane  select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "clip-copy"
bind -T copy-mode-vi TripleClick1Pane  select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "clip-copy"

# Vi-style yank, same OSC 52 path.
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip-copy"
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "clip-copy"

# Pasting comes from the OUTER terminal, not from inside tmux: use
# Ctrl+Shift+V (alacritty's paste shortcut) or Shift+Middle-Click (bypasses
# tmux mouse capture so alacritty pastes the local primary selection).
# The default middle-click binding would paste the remote tmux buffer, which
# is misleading — unbind it so Shift+Middle-Click is the only middle paste.
unbind -T root MouseDown2Pane

# =============================================================================
# Bindings
# =============================================================================

# Intuitive splits that inherit the current pane's cwd.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file -F "#{current_file}" \; display "tmux.conf reloaded"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# =============================================================================
# Visual style — WildCherry, matched to alacritty.toml
# =============================================================================
# bg     #1f1626   panel  #2a1f35   muted  #4a4253
# fg     #d9faff   accent #dd00ff   purple #873bdb
# pink   #d94085   yellow #ffd06e   green  #2ab250

set -g pane-border-style "fg=#4a4253"
set -g pane-active-border-style "fg=#dd00ff"
set -g pane-border-lines single

set -g mode-style "bg=#dd00ff,fg=#1f1626"
set -g message-style "bg=#2a1f35,fg=#d9faff"
set -g message-command-style "bg=#2a1f35,fg=#ffd06e"
set -g copy-mode-match-style "bg=#ffd06e,fg=#1f1626"
set -g copy-mode-current-match-style "bg=#dd00ff,fg=#1f1626"

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#2a1f35,fg=#d9faff"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[bg=#dd00ff,fg=#1f1626,bold]  #S #[bg=#2a1f35,fg=#dd00ff]#[default] "

setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#2a1f35,bg=#2a1f35] #[fg=#c1b8b6,bg=#2a1f35]#I  #{b:pane_current_path} #[fg=#2a1f35,bg=#2a1f35]"
setw -g window-status-current-format "#[fg=#2a1f35,bg=#dd00ff]#[fg=#1f1626,bg=#dd00ff,bold] #I  #{b:pane_current_path}#{?window_zoomed_flag,  ,} #[fg=#dd00ff,bg=#2a1f35]"
setw -g window-status-activity-style "fg=#ffd06e,bg=#2a1f35"
setw -g window-status-bell-style     "fg=#d94085,bg=#2a1f35,bold"

set -g status-right "#[fg=#873bdb,bg=#2a1f35]#[bg=#873bdb,fg=#d9faff,bold]   #h #[fg=#4a4253,bg=#873bdb]#[bg=#4a4253,fg=#d9faff,bold]   %a %b %d  %H:%M "
